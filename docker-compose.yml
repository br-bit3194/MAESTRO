services:
  ticket:
    build: ./ticket
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    networks:
      - maestro-network

  healthcheck:
    build: ./healthcheck
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    networks:
      - maestro-network

  memory:
    build: ./memory
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
    networks:
      - maestro-network

  orchestrator:
    build: ./orchestrator
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
    depends_on:
      - ticket
      - healthcheck
      - memory
      - sandbox
    networks:
      - maestro-network

  sandbox:
    build: ./sandbox
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
    networks:
      - maestro-network

networks:
  maestro-network:
    driver: bridge
